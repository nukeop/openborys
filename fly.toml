# Shared Fly.io config for all bot apps deployed from this repo.
# There is intentionally no `app =` here: deploy explicitly with `fly deploy -a <app-name>`.
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

primary_region = 'fra'

[build]

[deploy]
  strategy = "immediate"
  max_unavailable = 1

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
